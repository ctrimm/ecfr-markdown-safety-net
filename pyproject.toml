[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ecfr-markdown"
version = "0.1.0"
description = "Export the Electronic Code of Federal Regulations (eCFR) to Markdown, one file per section, with effective dates and OKF front matter."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []

[project.scripts]
ecfr-md = "ecfr_markdown.cli:main"

[tool.setuptools]
packages = ["ecfr_markdown"]
